<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Budget Tracker</h1>
        </header>

        <section class="summary">
            <div class="card balance">
                <p>Current Balance</p>
                <h2 id="balance">$0.00</h2>
            </div>
            <div class="row-cards">
                <div class="card income">
                    <p>Income</p>
                    <h3 id="total-income">$0.00</h3>
                </div>
                <div class="card expense">
                    <p>Expenses</p>
                    <h3 id="total-expense">$0.00</h3>
                </div>
            </div>
        </section>

        <section class="add-transaction">
            <h3>Add Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Coffee, Freelance" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <button type="submit" class="btn-add">Add Transaction</button>
            </form>
        </section>

        <section class="transactions">
            <h3>Transaction History</h3>
            <div id="transactions-list">
                <p class="empty-message">No transactions yet. Add one above.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
