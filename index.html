<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <p class="eyebrow">Personal finance</p>
            <h1>Budget Tracker</h1>
            <p class="subtitle">Track income and spending in one place.</p>
        </header>

        <section class="balance-card" aria-labelledby="balance-heading">
            <h2 id="balance-heading">Your balance</h2>
            <p id="balance" class="balance" aria-live="polite">$0.00</p>
            <div class="totals">
                <div class="total income">
                    <span>Income</span>
                    <strong id="income-total">$0.00</strong>
                </div>
                <div class="total expense">
                    <span>Expenses</span>
                    <strong id="expense-total">$0.00</strong>
                </div>
            </div>
        </section>

        <form id="transaction-form" class="card form" novalidate>
            <h2>Add transaction</h2>

            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="e.g. Groceries" autocomplete="off" required>

            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="0.00" min="0.01" step="0.01" required>

            <div class="form-row">
                <div>
                    <label for="type">Type</label>
                    <select id="type" name="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Housing">Housing</option>
                        <option value="Transport">Transport</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <p id="form-error" class="form-error" role="alert" hidden></p>
            <button type="submit">Add transaction</button>
        </form>

        <section class="card history">
            <div class="history-header">
                <h2>History</h2>
                <div class="filters" role="group" aria-label="Filter transactions">
                    <button type="button" class="filter is-active" data-filter="all">All</button>
                    <button type="button" class="filter" data-filter="income">Income</button>
                    <button type="button" class="filter" data-filter="expense">Expenses</button>
                </div>
            </div>
            <ul id="transaction-list"></ul>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
